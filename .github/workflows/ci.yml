# Build, clippy and the test suite on every push and pull request, on Linux x86-64, Linux
# ARM64 and macOS ARM64 (Apple silicon).
# No `cargo fmt --check`: the code is formatted by hand.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLINT_VERSION: 3.6.0
  OPENBLAS_NUM_THREADS: 1

jobs:
  test:
    name: test (${{ matrix.os == 'ubuntu-24.04-arm' && 'Linux ARM64, ' || '' }}${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        profile: [release, debug]
        flint_target: [linux-x86-64-avx2]
        include:
          - os: ubuntu-24.04-arm
            profile: release
            flint_target: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install GMP, MPFR and OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev libopenblas-dev

      - name: Cache FLINT
        id: flint
        uses: actions/cache@v4
        with:
          path: ~/flint
          key: flint-${{ env.FLINT_VERSION }}-${{ matrix.flint_target }}-${{ hashFiles('build/flint/**') }}

      - name: Build FLINT
        if: steps.flint.outputs.cache-hit != 'true'
        env:
          FLINT_TARBALL_URL: https://github.com/flintlib/flint/releases/download/v${{ env.FLINT_VERSION }}/flint-${{ env.FLINT_VERSION }}.tar.gz
        run: build/flint/${{ matrix.flint_target }}.sh "$HOME/flint"

      - name: Use FLINT
        run: |
          echo "PKG_CONFIG_PATH=$HOME/flint/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/flint/lib" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.profile }}

      - name: Build
        run: cargo build ${{ matrix.profile == 'release' && '--release' || '' }}

      - name: Clippy
        if: matrix.profile == 'release'
        run: cargo clippy --release --all-targets

      - name: Test
        run: cargo test ${{ matrix.profile == 'release' && '--release' || '' }} --no-fail-fast

  macos:
    name: test (macOS ARM64, release)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install GMP, MPFR and pkg-config
        run: brew install gmp mpfr pkgconf

      - name: Cache FLINT
        id: flint
        uses: actions/cache@v4
        with:
          path: ~/flint
          key: flint-${{ env.FLINT_VERSION }}-apple-arm64-${{ hashFiles('build/flint/**') }}

      - name: Build FLINT
        if: steps.flint.outputs.cache-hit != 'true'
        env:
          FLINT_TARBALL_URL: https://github.com/flintlib/flint/releases/download/v${{ env.FLINT_VERSION }}/flint-${{ env.FLINT_VERSION }}.tar.gz
        run: build/flint/apple-arm64.sh "$HOME/flint"

      - name: Use FLINT
        run: |
          echo "PKG_CONFIG_PATH=$HOME/flint/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$HOME/flint/lib" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release --no-fail-fast

  avx512:
    name: build (Linux x86-64 AVX-512, release)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install GMP, MPFR and OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev libopenblas-dev

      - name: Cache FLINT
        id: flint
        uses: actions/cache@v4
        with:
          path: ~/flint
          key: flint-${{ env.FLINT_VERSION }}-linux-x86-64-avx512-${{ hashFiles('build/flint/**') }}

      - name: Build FLINT
        if: steps.flint.outputs.cache-hit != 'true'
        env:
          FLINT_TARBALL_URL: https://github.com/flintlib/flint/releases/download/v${{ env.FLINT_VERSION }}/flint-${{ env.FLINT_VERSION }}.tar.gz
        run: build/flint/linux-x86-64-avx512.sh "$HOME/flint"

      - name: Use FLINT
        run: |
          echo "PKG_CONFIG_PATH=$HOME/flint/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/flint/lib" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86-64-avx512-release

      - name: Build
        run: cargo build --release
