# Prepare release archives without publishing a release, image or tag.
name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  FLINT_VERSION: 3.6.0
  OPENBLAS_NUM_THREADS: 1

jobs:
  linux:
    name: archive (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86-64
            runner: ubuntu-24.04
            flint: linux-x86-64
          - target: linux-x86-64-avx2
            runner: ubuntu-24.04
            flint: linux-x86-64-avx2
          - target: linux-x86-64-avx512
            runner: ubuntu-24.04
            flint: linux-x86-64-avx512
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            flint: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev libopenblas-dev patchelf

      - name: Cache FLINT
        id: flint
        uses: actions/cache@v4
        with:
          path: ~/flint
          key: release-flint-${{ env.FLINT_VERSION }}-${{ matrix.flint }}-${{ hashFiles('build/flint/**') }}

      - name: Build FLINT
        if: steps.flint.outputs.cache-hit != 'true'
        env:
          FLINT_TARBALL_URL: https://github.com/flintlib/flint/releases/download/v${{ env.FLINT_VERSION }}/flint-${{ env.FLINT_VERSION }}.tar.gz
        run: build/flint/${{ matrix.flint }}.sh "$HOME/flint"

      - name: Use FLINT
        run: |
          echo "PKG_CONFIG_PATH=$HOME/flint/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/flint/lib" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build archive
        run: |
          cargo build --release
          package="$RUNNER_TEMP/calyx-${{ matrix.target }}"
          build/package/linux.sh target/release/calyx "$package"
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf "dist/calyx-${{ matrix.target }}.tar.gz" "calyx-${{ matrix.target }}"

      - name: Check archive on a clean system
        run: |
          check="$RUNNER_TEMP/check-${{ matrix.target }}"
          mkdir "$check"
          tar -C "$check" -xzf "dist/calyx-${{ matrix.target }}.tar.gz"
          package="$check/calyx-${{ matrix.target }}"
          docker run --rm \
            -v "$PWD/build/package/check-linux.sh:/check-linux.sh:ro" \
            -v "$package:/opt/calyx:ro" \
            ubuntu:24.04 bash /check-linux.sh /opt/calyx

      - uses: actions/upload-artifact@v4
        with:
          name: calyx-${{ matrix.target }}
          path: dist/calyx-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  macos:
    name: archive (apple-arm64)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install gmp mpfr pkgconf

      - name: Cache FLINT
        id: flint
        uses: actions/cache@v4
        with:
          path: ~/flint
          key: release-flint-${{ env.FLINT_VERSION }}-apple-arm64-${{ hashFiles('build/flint/**') }}

      - name: Build FLINT
        if: steps.flint.outputs.cache-hit != 'true'
        env:
          FLINT_TARBALL_URL: https://github.com/flintlib/flint/releases/download/v${{ env.FLINT_VERSION }}/flint-${{ env.FLINT_VERSION }}.tar.gz
        run: build/flint/apple-arm64.sh "$HOME/flint"

      - name: Use FLINT
        run: |
          echo "PKG_CONFIG_PATH=$HOME/flint/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$HOME/flint/lib" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-apple-arm64

      - name: Build archive
        run: |
          cargo build --release
          package="$RUNNER_TEMP/calyx-apple-arm64"
          build/package/macos.sh target/release/calyx "$package"
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf dist/calyx-apple-arm64.tar.gz calyx-apple-arm64

      - name: Check archive
        run: |
          check="$RUNNER_TEMP/check-apple-arm64"
          mkdir "$check"
          tar -C "$check" -xzf dist/calyx-apple-arm64.tar.gz
          build/package/check-macos.sh "$check/calyx-apple-arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: calyx-apple-arm64
          path: dist/calyx-apple-arm64.tar.gz
          if-no-files-found: error

  docker:
    name: image check (general x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build and check image
        run: |
          docker build --tag calyx-package-check .
          docker run --rm calyx-package-check --version --verbose
          printf '1 + 1;\n' | docker run --rm -i calyx-package-check -b | grep -Fx 2
